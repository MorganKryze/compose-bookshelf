services:
  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    volumes:
      - ${DOCKER_VOLUMES_PATH}/beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: ${BESZEL_AGENT_LISTEN_ADDRESS}
      HUB_URL: ${BESZEL_HUB_URL}
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: "${BESZEL_AGENT_TOKEN}"
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations: 
          cpus: '0.10'
          memory: 64M