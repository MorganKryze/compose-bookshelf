services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_VOLUMES_PATH}/code-server/config:/config
      - ${DOCKER_PATH}:/docker
      # You may uncomment and add extra paths if needed
      #- ${EXTRA_PATH_1}:/extra1
      #- ${EXTRA_PATH_2}:/extra2
    expose:
      - 8443
    networks:
      - pangolin
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  pangolin:
    external: true