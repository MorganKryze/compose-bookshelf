services:
  enclosed:
    image: corentinth/enclosed
    container_name: enclosed
    restart: unless-stopped
    environment:
      PUBLIC_IS_SETTING_NO_EXPIRATION_ALLOWED: ${PUBLIC_IS_SETTING_NO_EXPIRATION_ALLOWED}
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DOCKER_VOLUMES_PATH}/enclosed:/app/.data
    expose:
      - 8787
    networks:
      - pangolin
    labels:
      com.centurylinklabs.watchtower.enable: true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

networks:
  pangolin:
    external: true